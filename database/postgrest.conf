# ==============================================================================
# PostgREST Configuration File for Bonchi Restaurant Money App
# ==============================================================================

# Database connection URI (connecting through the authenticator role)
db-uri = "postgres://authenticator:bonchi_authenticator_secret_2026@localhost:5432/bonhchi_db"

# The PostgreSQL schema to expose through the REST API
db-schemas = "public"

# The database role to use when no client authentication (JWT) is provided
db-anon-role = "anon"

# Secret key used to decode client JWTs (MUST MATCH JWT_SECRET in Express backend!)
# Must be at least 32 characters long
jwt-secret = "super_secret_bonchi_jwt_key_2026_at_least_32_characters_long"

# Port on which the PostgREST REST API server listens
server-port = 3001

# Max rows returned in a single response
max-rows = 500

# OpenAPI Swagger specification enabled at root /
openapi-mode = "follow-privileges"
